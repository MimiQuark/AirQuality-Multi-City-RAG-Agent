[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air-quality-agent"
version = "2.2.0"
description = "Hybrid RAG and tool-calling agent for multi-city air-quality analysis"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.100,<1",
  "uvicorn>=0.23,<1",
  "pydantic>=2,<3",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "scikit-learn>=1.3,<2",
  "joblib>=1.3,<2",
  "requests>=2.31,<3",
  "langgraph>=0.2,<2",
  "langchain-openai>=0.1,<2",
]

[project.optional-dependencies]
rag = ["sentence-transformers>=3,<6", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
mlops = ["mlflow>=2.18,<4", "optuna>=3.6,<5"]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "httpx>=0.27,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires PostgreSQL/pgvector"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
